[package]
name = "foible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../README.md"
categories = ["rust-patterns", "development-tools::debugging"]
description = "Lightweight typed error chaining — #[derive(Trace)] with no Display or std::error::Error boilerplate"
keywords = ["error", "error-handling", "derive", "macro", "source"]
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
# `alloc` enables `Trace::trace() -> String`. `std` is currently only a marker
# for the default build; the crate itself is `no_std`.
std = ["alloc"]
alloc = []

[dependencies]
foible-derive = { path = "../foible-derive", version = "=1.0.0" }

[dev-dependencies]
trybuild = "1.0"
